# Mantiene despierta la API de Render (plan gratuito): sin tráfico durante ~15 minutos el
# servicio se duerme y la primera petición tarda casi un minuto. Este ping a /health cada
# 10 minutos evita ese arranque en frío.
#
# Notas:
# - GitHub puede retrasar unos minutos las ejecuciones programadas; 10 min deja margen.
# - Si el repositorio pasa 60 días sin actividad, GitHub desactiva los workflows programados
#   (se reactivan desde la pestaña Actions).
# - También se puede lanzar a mano desde Actions > Keep alive > Run workflow.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping a /health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a la API
        env:
          HEALTH_URL: https://fintrack-api-2z1p.onrender.com/health
        run: |
          # Tres intentos: si el servicio estaba dormido, el primero lo despierta.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$HEALTH_URL" || true)
            echo "Intento $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "La API no respondió 200 en /health" >&2
          exit 1
