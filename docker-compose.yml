# Entorno local de FinTrack: PostgreSQL + backend.
#
#   docker compose up -d db            -> solo la base de datos (backend con `npm run dev`)
#   docker compose up --build          -> base de datos + backend en contenedores
#   docker compose down                -> apaga todo (conserva los datos)
#   docker compose down -v             -> apaga todo y BORRA los datos (recrea el esquema)
#
# Variables: copiar .env.example a .env (ver README). Todas tienen valor por defecto.

services:
  db:
    image: postgres:16-alpine
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético, solo cuando el volumen está vacío.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fintrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-fintrack}:${POSTGRES_PASSWORD:-fintrack_dev}@db:5432/${POSTGRES_DB:-fintrack}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
