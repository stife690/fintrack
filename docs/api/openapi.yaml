openapi: 3.0.3
info:
  title: FinTrack API
  version: "2.0.1"
  description: |
    PWA de control de gastos e ingresos con categorización e insights por IA,
    presupuestos con alertas, sincronización offline y notificaciones push.

    Generado a partir de **Contrato_API_FinTrack.docx v2.0 (28/09/2026)**, que es la
    referencia narrativa. Este archivo es la referencia ejecutable (Swagger UI) para
    las pruebas manuales durante la sustentación.

    **v2.0.1 — correcciones de consistencia respecto al .docx:**
    - `details` de los errores usa `field` / `problem` (el contrato fija los nombres de campo en inglés).
    - `amount <= 0` responde **422** `VALIDATION_ERROR` con `details` (regla de negocio, sección 10);
      400 queda solo para un body malformado a nivel de tipos.
    - `/health` vive fuera de `/api/v1` (se sobrescribe `servers` en esa ruta).
    - `POST /sync/batch` devuelve `syncedAt` para que el cliente sepa qué `lastSyncedAt` enviar la próxima vez.

    **Convenciones generales**
    - Autenticación: access token JWT de 15 min en `Authorization: Bearer <token>`, salvo en
      registro, login, refresh y health. Refresh token de 30 días (se guarda hasheado en el servidor).
    - `401 UNAUTHORIZED` (sin token o inválido) vs `401 TOKEN_EXPIRED` (vencido → llamar a `/auth/refresh`).
    - Recurso de otro usuario → `404 NOT_FOUND`, nunca 403 (RN-01).
    - Moneda: COP. `amount` siempre viaja como número JSON, nunca como texto.
    - Fechas de dominio: `YYYY-MM-DD`. Timestamps del sistema: ISO 8601 completo en UTC.
    - Nombres de campo en inglés; valores de dominio (`ingreso`, `gasto`) en español.
  contact:
    name: Equipo FinTrack

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://fintrack-api-2z1p.onrender.com/api/v1
    description: Producción (Render)

tags:
  - name: Health
    description: Verificación de disponibilidad del servicio
  - name: Auth
    description: Registro, login (con contraseña o con Google), refresh y logout (F1 — REQ-001 a REQ-005)
  - name: Users
    description: Perfil y configuración del usuario
  - name: Transactions
    description: Registro, consulta y resumen de transacciones (F2, F3, F4 — REQ-006 a REQ-015)
  - name: Categories
    description: Catálogo fijo de categorías (RN-02)
  - name: Budgets
    description: Presupuestos y alertas (F5, F6 — REQ-016 a REQ-019)
  - name: Insights
    description: Insights financieros por IA (F7 — REQ-020, REQ-021)
  - name: Sync
    description: Sincronización offline (F8, F9 — REQ-022 a REQ-025)
  - name: Push
    description: Notificaciones push y recordatorio diario (F11 — REQ-029, REQ-030)
  - name: Reports
    description: Exportación de reportes (F12 — REQ-031 a REQ-033)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Health
  /health:
    servers:
      - url: http://localhost:3000
        description: Desarrollo local (fuera de /api/v1)
      - url: https://fintrack-api-2z1p.onrender.com
        description: Producción (fuera de /api/v1)
    get:
      tags: [Health]
      summary: Prueba de humo del despliegue
      description: Endpoint público. Lo usan Render (health check) y el smoke test.
      security: []
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Registra un nuevo usuario (REQ-001, REQ-003)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Usuario creado; devuelve la misma forma que el login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "EMAIL_TAKEN — el correo ya está registrado (REQ-003)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: EMAIL_TAKEN, message: El correo ya está registrado }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica y entrega access + refresh token (REQ-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Autenticación exitosa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "UNAUTHORIZED — credenciales inválidas, sin indicar qué campo falló (REQ-004)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: UNAUTHORIZED, message: Correo o contraseña incorrectos }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/google:
    post:
      tags: [Auth]
      summary: Inicia sesión (o crea la cuenta) con Google
      description: |
        El frontend obtiene un `credential` (id_token firmado por Google) con Google Identity Services y
        lo envía aquí. El servidor verifica la firma, que el token sea para su `GOOGLE_CLIENT_ID` y que el
        correo esté verificado; no usa el secreto de cliente. Si ya existe una cuenta con ese correo, entra
        a esa misma cuenta; si no, la crea con el nombre de Google. Las cuentas nuevas no tienen una
        contraseña utilizable. Devuelve la misma forma que el login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: id_token (JWT) de Google Identity Services }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "UNAUTHORIZED — el token de Google no es válido o su correo no está verificado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: UNAUTHORIZED, message: No pudimos verificar tu cuenta de Google }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "GOOGLE_NOT_CONFIGURED — el servidor no tiene `GOOGLE_CLIENT_ID`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: GOOGLE_NOT_CONFIGURED, message: El inicio de sesión con Google no está disponible }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el access token (y rota el refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Tokens renovados
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "UNAUTHORIZED — refresh token inválido, vencido o revocado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token en el servidor
      description: No basta con que el cliente borre su copia; el servidor marca `revoked_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "204": { description: Sesión cerrada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Users
  /users/me:
    get:
      tags: [Users]
      summary: Datos del usuario autenticado
      description: Lo usa la PWA al recargar para validar el token guardado.
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Cambia el nombre visible del usuario
      description: >
        El nombre es opcional y solo se usa para saludar en la app. Se recorta y los espacios
        repetidos quedan en uno. `null` o un texto vacío lo borran.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/me/reminder-settings:
    get:
      tags: [Users, Push]
      summary: Lee la configuración del recordatorio diario
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Users, Push]
      summary: Configura las horas (hasta 5 al día) y la zona horaria del recordatorio (REQ-030)
      description: El servidor corre en UTC; la zona horaria evita enviar el recordatorio a la hora equivocada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderSettings" }
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Transactions
  /transactions:
    get:
      tags: [Transactions]
      summary: Lista transacciones del usuario, orden por fecha desc (REQ-009)
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: category, in: query, description: Clave de la categoría, schema: { $ref: "#/components/schemas/CategoryKey" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: Búsqueda por texto en la descripción, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                required: [data, page, pageSize, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Transactions]
      summary: Registra una transacción (REQ-006, REQ-007)
      description: |
        Si `category` viene vacío, la descripción se envía a categorización IA (REQ-010).
        Si la IA no responde, la transacción se guarda con `category: null` y
        `source: sin_clasificar` (REQ-011). La respuesta incluye la alerta de presupuesto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: Transacción creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionWithAlert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /transactions/summary:
    get:
      tags: [Transactions]
      summary: Resumen por categoría y periodo para el dashboard (F4 — REQ-013, REQ-014)
      description: Sin transacciones responde totales en 0 y listas vacías, nunca error (REQ-015).
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [week, month, year] } }
        - { name: date, in: query, required: false, description: "Cualquier día dentro del periodo (por defecto hoy, America/Bogota). La semana va de lunes a domingo.", schema: { type: string, format: date } }
      responses:
        "200":
          description: Resumen del periodo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /transactions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Transactions]
      summary: Obtiene una transacción puntual (REQ-008)
      responses:
        "200":
          description: Transacción
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Transactions]
      summary: Edita una transacción (REQ-008, REQ-012)
      description: Si se envía `category`, `source` pasa a `manual` (corrección manual, REQ-012).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdate" }
      responses:
        "200":
          description: Transacción actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionWithAlert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Transactions]
      summary: Elimina una transacción (borrado lógico, RN-06)
      description: Marca `deletedAt`; la fila se conserva para reportarla en `/sync/batch`.
      responses:
        "204": { description: Eliminada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      summary: Catálogo fijo de categorías, separado por tipo (RN-02)
      responses:
        "200":
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                required: [expense, income]
                properties:
                  expense:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
                  income:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
              example:
                expense:
                  - { key: alimentacion, name: Alimentación }
                  - { key: transporte, name: Transporte }
                income:
                  - { key: salario, name: Salario }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Budgets
  /budgets:
    get:
      tags: [Budgets]
      summary: Lista presupuestos del mes con consumo y alerta
      description: |
        `consumed` suma los gastos no borrados del usuario en esa categoría y mes.
        `percentage` = consumed / amount × 100 (2 decimales); `alert.level` es `warning_80`
        desde el 80 % y `exceeded_100` desde el 100 % (RN-04).
      parameters:
        - name: month
          in: query
          description: Mes AAAA-MM. Si se omite, el mes actual en la zona horaria del usuario.
          schema: { $ref: "#/components/schemas/Month" }
      responses:
        "200":
          description: Listado de presupuestos (lista vacía si no hay ninguno en el mes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Budget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Budgets]
      summary: Crea un presupuesto por categoría y mes (solo categorías de gasto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, month, amount]
              properties:
                category: { $ref: "#/components/schemas/ExpenseCategoryKey" }
                month: { $ref: "#/components/schemas/Month" }
                amount: { $ref: "#/components/schemas/Amount" }
      responses:
        "201":
          description: Presupuesto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "BUDGET_EXISTS — ya existe un presupuesto para esa categoría y mes (RN-03)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budgets/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [Budgets]
      summary: Edita el monto de un presupuesto (recalcula percentage, REQ-017)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Amount" }
      responses:
        "200":
          description: Presupuesto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Budgets]
      summary: Elimina un presupuesto
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Insights
  /insights:
    get:
      tags: [Insights]
      summary: Insights del mes actual (se generan y cachean si no existen)
      description: |
        Al LLM solo llegan datos agregados por categoría y periodo, nunca descripciones
        individuales ni identificadores del usuario (RN-05, RNF-09). Se cachean por usuario y mes
        y se regeneran si el resultado guardado tiene más de 24 horas; si la IA falla y hay uno
        guardado, se devuelve ese. Hace falta al menos un mes de historial (la transacción más
        antigua con un mes o más de antigüedad) y gastos en el mes actual o el anterior.
      responses:
        "200":
          description: Insights del mes
          content:
            application/json:
              schema:
                type: object
                required: [month, insights]
                properties:
                  month: { $ref: "#/components/schemas/Month" }
                  insights:
                    type: array
                    items: { $ref: "#/components/schemas/Insight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: "INSUFFICIENT_HISTORY — menos de un mes de historial"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "AI_UNAVAILABLE — el proveedor de IA no respondió a tiempo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- Sync
  /sync/batch:
    post:
      tags: [Sync]
      summary: Sincroniza un lote de operaciones hechas offline (máx. 200)
      description: |
        - Primero se valida todo el lote: si alguna operación es inválida responde 422
          (`details[].field` indica la operación, p. ej. `operations[3].serverId`) y no aplica nada.
        - Las operaciones se aplican en orden. `create` no duplica: si ese `localId` ya
          existe para el usuario, se devuelve el mismo `serverId` en `synced`.
        - Hay conflicto en `update`/`delete` cuando la transacción cambió en el servidor
          después de `lastSyncedAt`. Gana el `updatedAt` más reciente (last-write-wins, RN-07):
          `client_wins` aplica el cambio; `server_wins` lo descarta. Ambos casos van en
          `conflicts` con la `serverVersion` final. Sin conflicto, va en `synced`.
        - Una transacción creada offline sin categoría se categoriza con IA al sincronizar,
          solo para las primeras `SYNC_AI_MAX` del lote (por defecto 20); las demás y las que
          la IA no logra clasificar quedan con `source: sin_clasificar`.
        - `serverChanges` devuelve las transacciones del usuario (incluidas las borradas
          lógicamente) modificadas después de `lastSyncedAt`, sin las de este lote (REQ-025).
          Con `lastSyncedAt: null` (primera vez) devuelve todas las no borradas.
        - `syncStatus` vive solo en IndexedDB; el servidor no lo almacena.
        - Un lote con operaciones cuenta para el límite de peticiones de la IA (puede responder 429).
          Un lote vacío (`operations: []`) solo trae `serverChanges`, no usa la IA y no cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: Resultado de la sincronización
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- Push
  /push/vapid-public-key:
    get:
      tags: [Push]
      summary: Llave pública VAPID para PushManager.subscribe()
      responses:
        "200":
          description: Llave pública
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push/subscribe:
    post:
      tags: [Push]
      summary: Registra la suscripción push del navegador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "201": { description: Suscripción registrada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Push]
      summary: Elimina la suscripción (el usuario desactivó las notificaciones, REQ-029)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "204": { description: Suscripción eliminada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Reports
  /reports/export:
    get:
      tags: [Reports]
      summary: Exporta el reporte del periodo en Excel, los movimientos en CSV o el reporte en PDF
      description: >
        XLSX: libro de Excel con la hoja Resumen (ingresos, gastos, balance, tasa de ahorro, gasto
        promedio diario, gastos e ingresos por categoría, top 5 de gastos y, si el periodo es un mes
        completo, los presupuestos de ese mes), la hoja Movimientos (con filtros y totales que respetan
        el filtro) y la hoja Por mes si el periodo abarca varios meses. Las cifras del resumen son
        fórmulas sobre la hoja Movimientos.
        CSV: una fila por movimiento no eliminado entre `from` y `to` (incluidos), del más antiguo al
        más reciente, con las columnas Fecha;Tipo;Categoría;Descripción;Monto;Origen. Separador `;`,
        UTF-8 con BOM y monto con coma decimal, para que Excel en español lo abra bien. Los textos que
        empiezan por = + - @ llevan un apóstrofo delante (evita fórmulas). El nombre del archivo es
        `fintrack_AAAA-MM.<ext>` si el rango es un mes completo y `fintrack_<from>_<to>.<ext>` si no.
        PDF: tamaño Carta. Página 1 con indicadores, gastos por categoría, gasto por día (o ingresos y
        gastos por mes si abarca varios meses), top 5 de gastos y presupuestos del mes; desde la página 2,
        la tabla de movimientos con totales. Usa las mismas cifras que el XLSX.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv, pdf] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Archivo generado
          headers:
            Content-Disposition:
              description: 'attachment; filename="fintrack_2026-09.csv"'
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: "NO_DATA — no hay transacciones en el periodo (REQ-033), o parámetros inválidos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de 15 minutos.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: "VALIDATION_ERROR — body malformado a nivel de tipos (JSON inválido, tipo incorrecto)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: "VALIDATION_ERROR — incumple una regla de negocio; `details` indica qué campo marcar"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_ERROR
              message: Datos inválidos
              details:
                - { field: amount, problem: Debe ser un número mayor que 0 }
    Unauthorized:
      description: "UNAUTHORIZED (sin token o inválido) o TOKEN_EXPIRED (llamar a /auth/refresh)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unauthorized:
              value: { error: { code: UNAUTHORIZED, message: Token inválido o ausente } }
            expired:
              value: { error: { code: TOKEN_EXPIRED, message: El token expiró } }
    NotFound:
      description: "NOT_FOUND — no existe o pertenece a otro usuario (RN-01, nunca 403)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "RATE_LIMITED — demasiadas peticiones (login, registro y endpoints con IA)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------- Errores
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - TOKEN_EXPIRED
                - NOT_FOUND
                - EMAIL_TAKEN
                - BUDGET_EXISTS
                - INSUFFICIENT_HISTORY
                - NO_DATA
                - RATE_LIMITED
                - INTERNAL_ERROR
                - AI_UNAVAILABLE
            message: { type: string }
            details:
              type: array
              description: Solo en errores de validación (422).
              items:
                type: object
                required: [field, problem]
                properties:
                  field: { type: string, example: amount }
                  problem: { type: string, example: Debe ser un número mayor que 0 }

    # ---------- Tipos base
    Amount:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      description: Monto en COP; siempre número JSON, nunca texto.
      example: 25000
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: "2026-09"
    TransactionType:
      type: string
      enum: [ingreso, gasto]
    ExpenseCategoryKey:
      type: string
      enum:
        - alimentacion
        - transporte
        - vivienda
        - servicios_publicos
        - salud
        - educacion
        - entretenimiento
        - ropa_accesorios
        - tecnologia
        - ahorro_inversion
        - otros
    IncomeCategoryKey:
      type: string
      enum: [salario, freelance, inversion_rendimientos, otros_ingresos]
    CategoryKey:
      oneOf:
        - { $ref: "#/components/schemas/ExpenseCategoryKey" }
        - { $ref: "#/components/schemas/IncomeCategoryKey" }
    NullableCategoryKey:
      type: string
      nullable: true
      description: Clave del catálogo (gasto o ingreso); null si no está clasificada.
      enum:
        - alimentacion
        - transporte
        - vivienda
        - servicios_publicos
        - salud
        - educacion
        - entretenimiento
        - ropa_accesorios
        - tecnologia
        - ahorro_inversion
        - otros
        - salario
        - freelance
        - inversion_rendimientos
        - otros_ingresos
        - null

    # ---------- Auth y usuario
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string, nullable: true, maxLength: 60, example: Felipe }
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      required: [id, email, name, timezone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name:
          type: string
          nullable: true
          maxLength: 60
          description: Nombre visible. `null` si el usuario no lo ha puesto.
          example: Felipe
        timezone: { type: string, example: America/Bogota }
    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, nullable: true, maxLength: 60, example: Felipe }
    ReminderSettings:
      type: object
      required: [times, timezone]
      properties:
        times:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: ["08:00", "20:00"]
          description: |
            Horas del recordatorio (HH:mm) en la zona horaria del usuario, hasta 5 al día. En el PUT se
            ordenan y se quitan las repetidas; un arreglo vacío desactiva el recordatorio.
        time:
          type: string
          nullable: true
          deprecated: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "08:00"
          description: |
            Compatibilidad con clientes anteriores. En la respuesta es la primera hora de `times` (o null).
            En el PUT se acepta en lugar de `times` (una sola hora; null desactiva).
        timezone: { type: string, example: America/Bogota }

    # ---------- Transacciones
    Category:
      type: object
      required: [key, name]
      properties:
        key: { type: string, example: alimentacion }
        name: { type: string, example: Alimentación }
    Transaction:
      type: object
      required: [id, userId, amount, description, type, category, source, date, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Amount" }
        description: { type: string }
        type: { $ref: "#/components/schemas/TransactionType" }
        category: { $ref: "#/components/schemas/NullableCategoryKey" }
        source:
          type: string
          enum: [manual, ia, sin_clasificar]
          description: Cómo se asignó la categoría; sin_clasificar cuando la IA falló.
        date: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Usado para last-write-wins (RN-07) }
        deletedAt: { type: string, format: date-time, nullable: true }
    TransactionInput:
      type: object
      required: [amount, description, type, date]
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        description: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/TransactionType" }
        category:
          allOf: [{ $ref: "#/components/schemas/NullableCategoryKey" }]
          description: Opcional; si viene vacío se categoriza con IA.
        date: { type: string, format: date }
    TransactionUpdate:
      type: object
      minProperties: 1
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        description: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/TransactionType" }
        category: { $ref: "#/components/schemas/NullableCategoryKey" }
        date: { type: string, format: date }
    TransactionWithAlert:
      type: object
      required: [transaction, alert]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        alert:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Alert" }]
          description: null si la categoría no tiene presupuesto o no hay alerta activa.
    CategoryTotal:
      type: object
      required: [category, total, percentage]
      properties:
        category: { $ref: "#/components/schemas/NullableCategoryKey" }
        total: { type: number }
        percentage: { type: number }
    Summary:
      type: object
      required: [period, from, to, income, expense, timeSeries]
      properties:
        period: { type: string, enum: [week, month, year] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        income:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items: { $ref: "#/components/schemas/CategoryTotal" }
        expense:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items: { $ref: "#/components/schemas/CategoryTotal" }
        timeSeries:
          type: array
          description: Un punto por día (week, month) o por mes (year, con el día 1 como fecha); solo días o meses con movimientos.
          items:
            type: object
            required: [date, income, expense]
            properties:
              date: { type: string, format: date }
              income: { type: number }
              expense: { type: number }

    # ---------- Presupuestos
    Alert:
      type: object
      required: [level, percentage]
      properties:
        level: { type: string, enum: [none, warning_80, exceeded_100] }
        percentage: { type: number, example: 85.5 }
    BudgetCreated:
      type: object
      required: [id, category, month, amount]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/ExpenseCategoryKey" }
        month: { $ref: "#/components/schemas/Month" }
        amount: { $ref: "#/components/schemas/Amount" }
    Budget:
      allOf:
        - { $ref: "#/components/schemas/BudgetCreated" }
        - type: object
          required: [consumed, percentage, alert]
          properties:
            consumed: { type: number }
            percentage: { type: number }
            alert: { $ref: "#/components/schemas/Alert" }

    # ---------- Insights
    Insight:
      type: object
      required: [type, title, detail]
      properties:
        type:
          type: string
          enum: [saving_opportunity, overspending_alert, positive_trend, general_tip]
          example: saving_opportunity
        title: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 300 }

    # ---------- Sync
    SyncOperation:
      type: object
      required: [op, localId]
      properties:
        op: { type: string, enum: [create, update, delete] }
        localId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Id generado en IndexedDB. En `create` el servidor lo guarda: si el mismo lote
            se reenvía (respuesta perdida), devuelve el mismo `serverId` sin duplicar.
        serverId:
          type: string
          format: uuid
          description: Id de la transacción en el servidor. Obligatorio en `update` y `delete`.
        updatedAt:
          type: string
          format: date-time
          description: |
            Hora en que se hizo el cambio en el dispositivo. Obligatoria en `update` y
            `delete`; se compara con el `updatedAt` del servidor (last-write-wins, RN-07).
        transaction:
          type: object
          description: |
            En `create`, la transacción completa (`TransactionInput`). En `update`, solo los
            campos que cambian (`TransactionUpdate`). Se omite en `delete`.
    SyncRequest:
      type: object
      required: [lastSyncedAt, operations]
      properties:
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: Última sincronización exitosa de este dispositivo; null la primera vez.
        operations:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/SyncOperation" }
    SyncResponse:
      type: object
      required: [synced, conflicts, serverChanges, syncedAt]
      properties:
        synced:
          type: array
          items:
            type: object
            required: [localId, serverId]
            properties:
              localId: { type: string }
              serverId: { type: string, format: uuid }
              transaction:
                allOf: [{ $ref: "#/components/schemas/Transaction" }]
                description: |
                  Solo en operaciones `create`: la transacción guardada. No vuelve en
                  `serverChanges` y el cliente necesita la categoría que le quedó (la IA pudo asignarla).
        conflicts:
          type: array
          items:
            type: object
            required: [localId, serverId, resolution, serverVersion]
            properties:
              localId: { type: string }
              serverId: { type: string, format: uuid }
              resolution: { type: string, enum: [server_wins, client_wins] }
              serverVersion:
                type: object
                nullable: true
                allOf: [{ $ref: "#/components/schemas/Transaction" }]
                description: |
                  Versión que queda en el servidor (la del cliente si ganó). `null` si el
                  `serverId` no existe o es de otro usuario: el cliente debe descartar el cambio.
        serverChanges:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        syncedAt:
          type: string
          format: date-time
          description: Guardar en el cliente y enviarlo como lastSyncedAt en la próxima sincronización.

    # ---------- Push
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
