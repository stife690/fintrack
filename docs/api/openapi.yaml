openapi: 3.0.3
info:
  title: FinTrack API
  version: "2.0.1"
  description: |
    PWA de control de gastos e ingresos con categorización e insights por IA,
    presupuestos con alertas, sincronización offline y notificaciones push.

    Generado a partir de **Contrato_API_FinTrack.docx v2.0 (28/09/2026)**, que es la
    referencia narrativa. Este archivo es la referencia ejecutable (Swagger UI) para
    las pruebas manuales durante la sustentación.

    **v2.0.1 — correcciones de consistencia respecto al .docx:**
    - `details` de los errores usa `field` / `problem` (el contrato fija los nombres de campo en inglés).
    - `amount <= 0` responde **422** `VALIDATION_ERROR` con `details` (regla de negocio, sección 10);
      400 queda solo para un body malformado a nivel de tipos.
    - `/health` vive fuera de `/api/v1` (se sobrescribe `servers` en esa ruta).
    - `POST /sync/batch` devuelve `syncedAt` para que el cliente sepa qué `lastSyncedAt` enviar la próxima vez.

    **Convenciones generales**
    - Autenticación: access token JWT de 15 min en `Authorization: Bearer <token>`, salvo en
      registro, login, refresh y health. Refresh token de 30 días (se guarda hasheado en el servidor).
    - `401 UNAUTHORIZED` (sin token o inválido) vs `401 TOKEN_EXPIRED` (vencido → llamar a `/auth/refresh`).
    - Recurso de otro usuario → `404 NOT_FOUND`, nunca 403 (RN-01).
    - Moneda: COP. `amount` siempre viaja como número JSON, nunca como texto.
    - Fechas de dominio: `YYYY-MM-DD`. Timestamps del sistema: ISO 8601 completo en UTC.
    - Nombres de campo en inglés; valores de dominio (`ingreso`, `gasto`) en español.
  contact:
    name: Equipo FinTrack

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://fintrack-api-2z1p.onrender.com/api/v1
    description: Producción (Render)

tags:
  - name: Health
    description: Verificación de disponibilidad del servicio
  - name: Auth
    description: Registro, login (con contraseña o con Google), refresh y logout (F1 — REQ-001 a REQ-005)
  - name: Users
    description: Perfil y configuración del usuario
  - name: Transactions
    description: Registro, consulta y resumen de transacciones (F2, F3, F4 — REQ-006 a REQ-015)
  - name: Categories
    description: Las 15 categorías de todos y las propias de cada usuario (RN-02)
  - name: Budgets
    description: Presupuestos y alertas (F5, F6 — REQ-016 a REQ-019)
  - name: Cards
    description: Tarjetas de crédito, pagos y ajuste con el banco
  - name: Insights
    description: Insights financieros por IA (F7 — REQ-020, REQ-021)
  - name: Analytics
    description: Analítica del mes sin IA — proyección, gastos hormiga y puntaje de salud financiera (FT-0019)
  - name: Ideas
    description: Lo que viene — ideas de los usuarios y sus votos (FT-0026)
  - name: WhatsApp
    description: Registro de movimientos por WhatsApp (FT-0029)
  - name: MoneyProfile
    description: Mi plata — cómo le entra la plata al usuario y sus compromisos mensuales (FT-0036)
  - name: Sync
    description: Sincronización offline (F8, F9 — REQ-022 a REQ-025)
  - name: Push
    description: Notificaciones push y recordatorio diario (F11 — REQ-029, REQ-030)
  - name: Notifications
    description: Centro de notificaciones dentro de la app (FT-0045)
  - name: Reports
    description: Exportación de reportes (F12 — REQ-031 a REQ-033)
  - name: Voice
    description: Registro de movimientos por voz (FT-0013)
  - name: Assistant
    description: Asistente financiero en Insights (chat con IA sobre los datos agregados del usuario)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Health
  /health:
    servers:
      - url: http://localhost:3000
        description: Desarrollo local (fuera de /api/v1)
      - url: https://fintrack-api-2z1p.onrender.com
        description: Producción (fuera de /api/v1)
    get:
      tags: [Health]
      summary: Prueba de humo del despliegue
      description: Endpoint público. Lo usan Render (health check) y el smoke test.
      security: []
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Registra un nuevo usuario (REQ-001, REQ-003)
      description: |
        Crea la cuenta sin verificar y envía al correo un enlace `APP_URL/verificar#token=…` que vence en
        24 horas (FT-0016). No abre sesión: hasta abrir el enlace, el login responde 403 EMAIL_NOT_VERIFIED.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Usuario creado sin sesión; falta confirmar el correo
          content:
            application/json:
              schema:
                type: object
                required: [email, verificationRequired]
                properties:
                  email: { type: string, format: email }
                  verificationRequired: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: "EMAIL_TAKEN — el correo ya está registrado (REQ-003)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: EMAIL_TAKEN, message: El correo ya está registrado }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica y entrega access + refresh token (REQ-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Autenticación exitosa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "UNAUTHORIZED — credenciales inválidas, sin indicar qué campo falló (REQ-004)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: UNAUTHORIZED, message: Correo o contraseña incorrectos }
        "403":
          description: "EMAIL_NOT_VERIFIED — la contraseña es correcta pero falta confirmar el correo (FT-0016)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  code: EMAIL_NOT_VERIFIED
                  message: Confirma tu correo para entrar. Revisa tu bandeja o pide un enlace nuevo.
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/google:
    post:
      tags: [Auth]
      summary: Inicia sesión (o crea la cuenta) con Google
      description: |
        El frontend obtiene un `credential` (id_token firmado por Google) con Google Identity Services y
        lo envía aquí. El servidor verifica la firma, que el token sea para su `GOOGLE_CLIENT_ID` y que el
        correo esté verificado; no usa el secreto de cliente. Si ya existe una cuenta con ese correo, entra
        a esa misma cuenta; si no, la crea con el nombre de Google. Las cuentas nuevas no tienen una
        contraseña utilizable. Devuelve la misma forma que el login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: id_token (JWT) de Google Identity Services }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "UNAUTHORIZED — el token de Google no es válido o su correo no está verificado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: UNAUTHORIZED, message: No pudimos verificar tu cuenta de Google }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "GOOGLE_NOT_CONFIGURED — el servidor no tiene `GOOGLE_CLIENT_ID`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: GOOGLE_NOT_CONFIGURED, message: El inicio de sesión con Google no está disponible }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el access token (y rota el refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Tokens renovados
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "UNAUTHORIZED — refresh token inválido, vencido o revocado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token en el servidor
      description: No basta con que el cliente borre su copia; el servidor marca `revoked_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "204": { description: Sesión cerrada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Envía un enlace para crear una contraseña nueva
      description: |
        Si el correo tiene cuenta, guarda la huella (SHA-256) de un token aleatorio que vence en 30 minutos,
        anula los enlaces anteriores sin usar y envía por correo `APP_URL/restablecer#token=<token>`.
        Responde lo mismo exista o no la cuenta, y no espera al envío del correo, para no revelar qué
        correos están registrados. Sin `EMAIL_API_KEY`, en desarrollo el enlace se imprime en la consola.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Solicitud recibida (exista o no la cuenta)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
              example:
                message: Si el correo está registrado, te enviamos un enlace para crear una contraseña nueva.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Cambia la contraseña con el token del enlace
      description: |
        En una sola sentencia gasta el token (sirve una vez), guarda la contraseña nueva y revoca todos los
        refresh tokens del usuario: después hay que iniciar sesión. La contraseña sigue las reglas del registro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: El token del enlace (lo que va después de `#token=`) }
                password: { type: string, minLength: 8 }
      responses:
        "204": { description: Contraseña cambiada y sesiones cerradas }
        "400":
          description: "VALIDATION_ERROR (cuerpo malformado) o INVALID_RESET_TOKEN — el enlace no existe, ya se usó o venció"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: INVALID_RESET_TOKEN, message: El enlace no es válido o ya venció. Pide uno nuevo. }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirma el correo con el token del enlace y abre sesión (FT-0016)
      description: |
        En una sola sentencia gasta el token (sirve una vez) y marca la cuenta como verificada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: El token del enlace (lo que va después de `#token=`) }
      responses:
        "200":
          description: Correo confirmado; devuelve la misma forma que el login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: "VALIDATION_ERROR (cuerpo malformado) o INVALID_VERIFICATION_TOKEN — el enlace no existe, ya se usó o venció"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { code: INVALID_VERIFICATION_TOKEN, message: El enlace no es válido o ya venció. Pide uno nuevo. }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Envía otro enlace para confirmar el correo (FT-0016)
      description: |
        Si el correo es de una cuenta sin verificar, envía un enlace nuevo y anula los anteriores. Responde
        lo mismo exista o no la cuenta, para no revelar qué correos están registrados.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Mensaje genérico
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- Users
  /users/me:
    get:
      tags: [Users]
      summary: Datos del usuario autenticado
      description: Lo usa la PWA al recargar para validar el token guardado.
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Cambia el nombre visible del usuario
      description: >
        El nombre es opcional y solo se usa para saludar en la app. Se recorta y los espacios
        repetidos quedan en uno. `null` o un texto vacío lo borran.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Users]
      summary: Elimina la cuenta y todos sus datos (FT-0017)
      description: >
        Pide confirmar con la contraseña o, en cuentas creadas con Google, con un `credential` nuevo
        de Google del mismo correo. En una sola transacción borra la cuenta y sus datos
        (movimientos, presupuestos, tarjetas, Mi plata, sesiones, WhatsApp, push e invitaciones
        pendientes a su correo); luego los archivos de sus soportes y envía un correo de aviso.
        En las vacas y negocios compartidos donde era el único administrador o dueño, el miembro
        más antiguo pasa a serlo; los que quedan sin miembros se borran. Sus aportes en vacas
        ajenas quedan sin nombre para que el total del grupo no cambie. No se puede deshacer.
        Comparte el límite de intentos por IP con el login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [password]
                  properties:
                    password: { type: string, maxLength: 200 }
                - type: object
                  required: [googleCredential]
                  properties:
                    googleCredential: { type: string, description: "id_token de Google Identity Services" }
      responses:
        "204": { description: Cuenta eliminada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`CONFIRMATION_FAILED`: la contraseña o la cuenta de Google no coinciden"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`GOOGLE_NOT_CONFIGURED`: el servidor no tiene Google configurado" }

  /users/me/reminder-settings:
    get:
      tags: [Users, Push]
      summary: Lee la configuración del recordatorio diario
      responses:
        "200":
          description: Configuración actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Users, Push]
      summary: Configura las horas (hasta 5 al día) y la zona horaria del recordatorio (REQ-030)
      description: El servidor corre en UTC; la zona horaria evita enviar el recordatorio a la hora equivocada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderSettings" }
      responses:
        "200":
          description: Configuración actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ---------------------------------------------------------------- Transactions
  /transactions:
    get:
      tags: [Transactions]
      summary: Lista transacciones del usuario, orden por fecha desc (REQ-009)
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/TransactionType" } }
        - { name: category, in: query, description: Clave de la categoría, schema: { $ref: "#/components/schemas/CategoryKey" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: "Búsqueda por texto en la descripción, sin distinguir tildes ni mayúsculas", schema: { type: string, maxLength: 100 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                required: [data, page, pageSize, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Transactions]
      summary: Registra una transacción (REQ-006, REQ-007)
      description: |
        Si `category` viene vacío, la descripción se envía a categorización IA (REQ-010).
        Si la IA no responde, la transacción se guarda con `category: null` y
        `source: sin_clasificar` (REQ-011). La respuesta incluye la alerta de presupuesto.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: Transacción creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionWithAlert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /transactions/summary:
    get:
      tags: [Transactions]
      summary: Resumen por categoría y periodo para el dashboard (F4 — REQ-013, REQ-014)
      description: Sin transacciones responde totales en 0 y listas vacías, nunca error (REQ-015).
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [week, month, year] } }
        - { name: date, in: query, required: false, description: "Cualquier día dentro del periodo (por defecto hoy, America/Bogota). La semana va de lunes a domingo.", schema: { type: string, format: date } }
      responses:
        "200":
          description: Resumen del periodo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /transactions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Transactions]
      summary: Obtiene una transacción puntual (REQ-008)
      responses:
        "200":
          description: Transacción
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Transactions]
      summary: Edita una transacción (REQ-008, REQ-012)
      description: Si se envía `category`, `source` pasa a `manual` (corrección manual, REQ-012).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdate" }
      responses:
        "200":
          description: Transacción actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionWithAlert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Transactions]
      summary: Elimina una transacción (borrado lógico, RN-06)
      description: |
        Marca `deletedAt`; la fila se conserva para reportarla en `/sync/batch`. Sus soportes de pago
        sí se borran del todo (fila y archivo, FT-0044).
      responses:
        "204": { description: Eliminada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions/{id}/attachments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Transactions]
      summary: Soportes de pago del movimiento (FT-0044)
      description: |
        Solo el dueño del movimiento los ve. Activos para los correos de `ATTACHMENTS_ALLOWED_EMAILS`
        (`*` para todos); si no, 403 `FEATURE_DISABLED` y el frontend no muestra la sección.
      responses:
        "200":
          description: Soportes y límites
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Attachment" } }
                  max: { type: integer, example: 3 }
                  maxBytes: { type: integer, example: 5242880 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FEATURE_DISABLED — el usuario aún no tiene los soportes activos" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Transactions]
      summary: Adjunta una foto o un PDF (cuerpo binario)
      description: |
        El cuerpo es el archivo crudo; el nombre va en `X-File-Name` con `encodeURIComponent`. El tipo
        se decide por los primeros bytes, no por `Content-Type`: JPG, PNG, WebP o PDF, hasta 5 MB y 3
        por movimiento. El archivo se guarda con un nombre aleatorio.
      parameters:
        - { name: X-File-Name, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Soporte creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: FEATURE_DISABLED }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "ATTACHMENT_LIMIT — el movimiento ya tiene 3 soportes" }
        "413": { description: "FILE_TOO_LARGE — pesa más de 5 MB" }
        "415": { description: "UNSUPPORTED_FILE — no es JPG, PNG, WebP ni PDF" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /transactions/{id}/attachments/{attachmentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Transactions]
      summary: El archivo del soporte, para verlo
      description: Responde el archivo con su tipo, `Content-Disposition inline` y `Cache-Control private, no-store`.
      responses:
        "200":
          description: El archivo
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: FEATURE_DISABLED }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Transactions]
      summary: Borra el soporte (la fila y el archivo)
      responses:
        "204": { description: Borrado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: FEATURE_DISABLED }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      summary: Las 15 categorías de todos y las propias del usuario, separadas por tipo (RN-02)
      description: |
        Primero las 15 de todos (`custom: false`), luego las que creó el usuario (`custom: true`).
        Nunca aparecen las de otro usuario (RN-01).
      responses:
        "200":
          description: Categorías que puede usar el usuario
          content:
            application/json:
              schema:
                type: object
                required: [expense, income]
                properties:
                  expense:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
                  income:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
              example:
                expense:
                  - { key: alimentacion, name: Alimentación, icon: null, color: null, custom: false }
                  - { key: c_k3x9m2qa7b, name: Mascotas, icon: paw-print, color: amber, custom: true }
                income:
                  - { key: salario, name: Salario, icon: null, color: null, custom: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Categories]
      summary: Crea una categoría propia (máximo 20 por usuario)
      description: |
        El nombre (1 a 30 caracteres) no puede repetir el de otra categoría que vea el usuario,
        incluidas las de todos, sin importar mayúsculas. La clave la genera el servidor (`c_` y 10
        caracteres). La IA también la tiene en cuenta al categorizar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, icon, color]
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
                type: { type: string, enum: [ingreso, gasto] }
                icon: { $ref: "#/components/schemas/CategoryIcon" }
                color: { $ref: "#/components/schemas/CategoryColor" }
            example: { name: Mascotas, type: gasto, icon: paw-print, color: amber }
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "CATEGORY_EXISTS — ya hay una con ese nombre; CATEGORY_LIMIT — ya tiene 20 propias"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /categories/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Categories]
      summary: Cambia nombre, ícono o color de una categoría propia
      description: El tipo no cambia. Las 15 de todos no se pueden editar (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
                icon: { $ref: "#/components/schemas/CategoryIcon" }
                color: { $ref: "#/components/schemas/CategoryColor" }
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "CATEGORY_EXISTS — ya hay una con ese nombre"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Categories]
      summary: Elimina una categoría propia sin perder movimientos
      description: |
        En una sola transacción: sus movimientos pasan a `otros` (gastos) u `otros_ingresos`
        (ingresos), sus presupuestos se borran y la categoría se elimina. Las 15 de todos no se
        pueden eliminar (404).
      responses:
        "200":
          description: Eliminada; `moved` dice cuántos movimientos cambiaron de categoría
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Budgets
  /budgets:
    get:
      tags: [Budgets]
      summary: Lista presupuestos del mes con consumo y alerta
      description: |
        `consumed` suma los gastos no borrados del usuario en esa categoría y mes.
        `percentage` = consumed / amount × 100 (2 decimales); `alert.level` es `warning_80`
        desde el 80 % y `exceeded_100` desde el 100 % (RN-04).
      parameters:
        - name: month
          in: query
          description: Mes AAAA-MM. Si se omite, el mes actual en la zona horaria del usuario.
          schema: { $ref: "#/components/schemas/Month" }
      responses:
        "200":
          description: Listado de presupuestos (lista vacía si no hay ninguno en el mes)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Budget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Budgets]
      summary: Crea un presupuesto por categoría y mes (solo categorías de gasto)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, month, amount]
              properties:
                category: { $ref: "#/components/schemas/ExpenseCategoryKey" }
                month: { $ref: "#/components/schemas/Month" }
                amount: { $ref: "#/components/schemas/Amount" }
      responses:
        "201":
          description: Presupuesto creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "BUDGET_EXISTS — ya existe un presupuesto para esa categoría y mes (RN-03)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budgets/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [Budgets]
      summary: Edita el monto de un presupuesto (recalcula percentage, REQ-017)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Amount" }
      responses:
        "200":
          description: Presupuesto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Budgets]
      summary: Elimina un presupuesto
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Cards
  /cards:
    get:
      tags: [Cards]
      summary: Lista las tarjetas de crédito del usuario con usado, disponible y próximo pago
      responses:
        "200":
          description: Tarjetas activas (lista vacía si no hay)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Cards]
      summary: Crea una tarjeta (solo los últimos 4 dígitos; nunca número, CVV ni vencimiento)
      description: |
        `used` = `limit` − `available`. `name` por defecto es "{Franquicia} {Nivel} ••{last4}".
        Niveles: visa y mastercard `clasica|gold|platinum|black`; amex `green|blue|gold|platinum`; otra `clasica`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "201":
          description: Tarjeta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "CARD_EXISTS — ya hay una tarjeta activa con esos últimos 4 dígitos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cards/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Cards]
      summary: Detalle de una tarjeta
      responses:
        "200":
          description: Tarjeta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Cards]
      summary: Edita una tarjeta (campos opcionales; no acepta `available`)
      description: |
        Enviar `available` responde 422 (para eso está `sync-with-bank`). Cambiar `limit` mantiene la
        deuda base; un cupo menor que lo usado responde 422 en `limit`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardInput" }
      responses:
        "200":
          description: Tarjeta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "CARD_EXISTS — otra tarjeta activa ya tiene esos últimos 4 dígitos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Cards]
      summary: Borra la tarjeta (borrado lógico; los gastos conservan su tarjeta)
      responses:
        "204": { description: Borrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cards/{id}/payments:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Cards]
      summary: Registra un pago a la tarjeta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Amount" }
                date: { type: string, format: date, description: "AAAA-MM-DD; hoy por defecto. Una fecha futura (en la zona del usuario) da 422 en `date`." }
      responses:
        "201":
          description: Pago registrado y tarjeta recalculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      date: { type: string, format: date }
                      amount: { type: number }
                  card: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cards/{id}/payments/{paymentId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Cards]
      summary: Borra un pago (borrado lógico)
      responses:
        "204": { description: Borrado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cards/{id}/sync-with-bank:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [Cards]
      summary: Ajusta la tarjeta a lo que dice el banco
      description: |
        `used` pasa a ser `limit` − `available`. Si el banco cobra más de lo que FinTrack tenía, se crea un
        gasto "Cargos del banco · {nombre}" (categoría `otros`, hoy) ligado a la tarjeta; FinTrack no calcula
        intereses, solo registra la diferencia que el usuario reporta. Si cobra menos, solo queda un ajuste
        (`kind: adjustment` en los movimientos). Todo ocurre en una transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: number, minimum: 0 }
                statementTotal: { type: number, minimum: 0 }
                statementDueDate: { type: string, format: date }
      responses:
        "200":
          description: Tarjeta ajustada
          content:
            application/json:
              schema:
                type: object
                properties:
                  card: { $ref: "#/components/schemas/Card" }
                  chargeTransaction: { type: object, nullable: true, description: "Gasto de cargos creado, o null." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cards/{id}/movements:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Cards]
      summary: Compras desde la última base, gastos de cargos del banco, todos los pagos y ajustes negativos, del más nuevo al más viejo
      responses:
        "200":
          description: Movimientos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string, enum: [purchase, payment, adjustment] }
                    id: { type: string, format: uuid }
                    date: { type: string, format: date }
                    amount: { type: number, description: "En `adjustment` lleva signo (negativo)." }
                    description: { type: string }
                    installments: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Mi plata
  /money-profile:
    get:
      tags: [MoneyProfile]
      summary: Perfil del usuario con sus compromisos (vacío si aún no responde)
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [MoneyProfile]
      summary: Cambia cómo le entra la plata y cuánta tiene
      description: "`balanceAt` solo cambia si cambia `balance`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyProfileInput" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /money-profile/plan:
    get:
      tags: [MoneyProfile]
      summary: Cuánto puede gastar o necesita ganar el usuario hoy (FT-0037)
      description: |
        Se calcula con fórmulas fijas, sin IA. `ready` es `false` si falta el tipo de ingreso o el saldo.
        Plata actual = todos los ingresos − todos los gastos; si el usuario corrigió su saldo, o los
        movimientos no dan más de 0, saldo + lo registrado después. Libre = plata actual − compromisos
        pendientes. Un compromiso está pagado si un gasto del mes lleva su nombre.
        `daily` (fecha fija): `perDay` = (libre + gastado hoy) ÷ días hasta `nextPay`, restando solo lo
        que vence antes del pago y lo atrasado. `goal` (sin fecha): `goal` = (compromisos + `pace` × días − plata) ÷
        días, hasta el último compromiso pendiente. `runway` (sin fecha, ya cubre todo): `runwayDays`
        = libre ÷ `pace`. `pace` y `usualIncome` piden 14 días de historial. La plata que no ha
        entrado nunca se cuenta.
      responses:
        "200":
          description: Plan de hoy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /money-profile/calendar:
    get:
      tags: [MoneyProfile]
      summary: Pagos de un mes y cuánto le queda al usuario después de cada uno (FT-0025)
      description: |
        Eventos del mes: compromisos de Mi plata, días de pago (sin monto: no se sabe cuánto le pagan) y lo
        que le falta aportar a cada vaca en su fecha límite. No guarda nada nuevo.
        `balanceAfter` parte de la plata actual (la de `/plan`) y resta en orden de fecha cada pago que
        falta; lo atrasado se resta hoy. Se proyecta hasta el próximo día de pago (fecha fija) o hasta el
        fin del mes siguiente (sin fecha); después es `null`, igual que en lo ya pagado o pasado.
        `risk`: `negativo` si queda menos de 0; `riesgo` si queda menos de 7 días de gasto normal (`pace`).
      parameters:
        - name: month
          in: query
          required: false
          description: Mes AAAA-MM. Sin él, el actual.
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Calendario del mes
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string, example: "2026-11" }
                  today: { type: string, format: date }
                  money: { type: number, nullable: true, description: Plata de hoy; null sin Mi plata configurada }
                  projectedUntil: { type: string, format: date, nullable: true, description: Hasta qué fecha (sin incluirla) hay saldo proyectado }
                  totals:
                    type: object
                    properties:
                      pending: { type: number, description: Lo que falta pagar del mes (pendiente o atrasado) }
                      paid: { type: number }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        kind: { type: string, enum: [compromiso, vaca, ingreso, card] }
                        id: { type: string, nullable: true }
                        name: { type: string }
                        amount: { type: number, nullable: true }
                        status: { type: string, nullable: true, enum: [pagado, pendiente, atrasado, sin_registro, null] }
                        balanceAfter: { type: number, nullable: true }
                        risk: { type: string, nullable: true, enum: [ok, riesgo, negativo, null] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /money-profile/welcome:
    post:
      tags: [MoneyProfile]
      summary: Guarda la bienvenida de una vez; sin datos, la marca como omitida
      description: Reintentar no repite compromisos. Omitir no borra lo que ya estaba guardado.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MoneyProfileInput" }
                - type: object
                  properties:
                    commitments:
                      type: array
                      maxItems: 30
                      items: { $ref: "#/components/schemas/CommitmentInput" }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoneyProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /money-profile/commitments:
    post:
      tags: [MoneyProfile]
      summary: Crea un compromiso mensual
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitmentInput" }
      responses:
        "201":
          description: Compromiso creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commitment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "COMMITMENT_EXISTS — el nombre ya existe · COMMITMENT_LIMIT — ya tiene 30"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /money-profile/commitments/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    put:
      tags: [MoneyProfile]
      summary: Cambia un compromiso
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitmentInput" }
      responses:
        "200":
          description: Compromiso actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commitment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "COMMITMENT_EXISTS — el nombre ya lo usa otro compromiso"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [MoneyProfile]
      summary: Elimina un compromiso
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Insights
  /insights:
    get:
      tags: [Insights]
      summary: Consejos de la semana o del mes actual (se generan y cachean si no existen)
      description: |
        Desde la primera semana de historial (REQ-021, cambio aprobado por el equipo):
        - Con al menos 7 días de historial y menos de un mes, compara la semana actual (de lunes a
          hoy) con la semana anterior completa (`period: week`).
        - Con un mes o más, compara el mes actual hasta hoy con el mes anterior (`period: month`).

        Al LLM solo llegan datos agregados por categoría y periodo, nunca descripciones
        individuales ni identificadores del usuario (RN-05, RNF-09). Se cachean por usuario y
        periodo (el mes o el lunes de la semana) y se regeneran si el resultado guardado tiene más
        de 24 horas; si la IA falla y hay uno guardado, se devuelve ese. Hacen falta gastos en
        alguno de los dos periodos.
      responses:
        "200":
          description: Consejos del periodo
          content:
            application/json:
              schema:
                type: object
                required: [period, month, from, insights]
                properties:
                  period:
                    type: string
                    enum: [week, month]
                    description: Periodo que se comparó.
                  month: { $ref: "#/components/schemas/Month" }
                  from:
                    type: string
                    format: date
                    description: Primer día del periodo actual (el lunes o el día 1 del mes).
                    example: "2026-10-19"
                  insights:
                    type: array
                    items: { $ref: "#/components/schemas/Insight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: "INSUFFICIENT_HISTORY — menos de una semana de historial o sin gastos en los dos periodos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "AI_UNAVAILABLE — el proveedor de IA no respondió a tiempo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- Analytics
  /analytics:
    get:
      tags: [Analytics]
      summary: Proyección de fin de mes, gastos hormiga y puntaje de salud financiera
      description: |
        Se calcula en el servidor con fórmulas fijas (`backend/src/services/analytics.service.js`),
        sin IA, con los movimientos del mes actual y de los 3 meses anteriores.
        - **Proyección**: `fijos + fijos pendientes + (variables ÷ días transcurridos) × días del mes`.
          Fijos = Vivienda y Servicios públicos; un fijo del mes pasado que aún no aparece se suma
          como pendiente. Ingresos esperados = el mayor entre los de este mes y los del anterior.
          `available` es `false` los dos primeros días del mes.
        - **Gastos hormiga**: gastos de $20.000 o menos; `flagged` desde 5 en el mes; `top`, las 3
          descripciones que más se repiten (sin tildes ni mayúsculas).
        - **Puntaje** (0 a 100): cuatro partes de 25 puntos, lineales entre sus extremos. Ahorro
          (20 % o más = 25, 0 % = 0), presupuestos sin pasarse (sin presupuestos = 12,5),
          gasto frente al promedio de los meses anteriores (igual o menor = 25, +30 % = 0; sin
          historial = 12,5) y gastos hormiga (5 % o menos = 25, 20 % o más = 0). Niveles:
          `excellent` ≥ 80, `good` ≥ 60, `attention` ≥ 40 y `risk`.
      responses:
        "200":
          description: Analítica del mes actual
          content:
            application/json:
              schema:
                type: object
                required: [month, day, daysInMonth, empty, daily, previousScore, projection, smallExpenses, health]
                properties:
                  month: { $ref: "#/components/schemas/Month" }
                  day: { type: integer, example: 29 }
                  daysInMonth: { type: integer, example: 31 }
                  empty:
                    type: boolean
                    description: "`true` si el mes aún no tiene movimientos."
                  daily:
                    type: array
                    description: Gasto acumulado del mes, un punto por día del 1 a hoy.
                    items:
                      type: object
                      required: [day, total]
                      properties:
                        day: { type: integer, example: 3 }
                        total: { type: number, example: 47000 }
                  previousScore:
                    type: integer
                    nullable: true
                    description: |
                      Puntaje del mes pasado con la misma fórmula (con lo que de verdad gastó e
                      ingresó), para mostrar el cambio. `null` si ese mes no tuvo movimientos.
                    example: 33
                  projection:
                    type: object
                    required:
                      - available
                      - spent
                      - projected
                      - pendingFixed
                      - oneOff
                      - saved
                      - income
                      - possibleIncome
                      - balance
                    properties:
                      available: { type: boolean }
                      spent: { type: number, example: 1840000 }
                      projected: { type: number, example: 2310000 }
                      pendingFixed: { type: number, example: 0 }
                      oneOff:
                        type: number
                        description: Compras grandes del mes; cuentan una vez, sin marcar el ritmo.
                        example: 0
                      saved:
                        type: number
                        description: Lo apartado en Ahorro/Inversión; no cuenta como gasto en el puntaje.
                        example: 0
                      income:
                        type: number
                        description: Ingresos que ya entraron este mes.
                        example: 2800000
                      possibleIncome:
                        type: number
                        description: Lo que falta para igualar los ingresos del mes pasado; no es seguro.
                        example: 0
                      balance:
                        type: number
                        description: Ingresos que ya entraron menos gasto proyectado (negativo si faltaría).
                        example: 490000
                  smallExpenses:
                    type: object
                    required: [threshold, count, total, share, yearly, flagged, top]
                    properties:
                      threshold: { type: number, example: 20000 }
                      count: { type: integer, example: 14 }
                      total: { type: number, example: 142000 }
                      share:
                        type: number
                        description: Porcentaje del gasto del mes.
                        example: 7.7
                      yearly:
                        type: number
                        description: Lo que sumarían en un año a este ritmo.
                        example: 1704000
                      flagged: { type: boolean }
                      top:
                        type: array
                        maxItems: 3
                        items:
                          type: object
                          required: [description, count, total]
                          properties:
                            description: { type: string, example: Café }
                            count: { type: integer, example: 6 }
                            total: { type: number, example: 33000 }
                  health:
                    type: object
                    required: [score, level, parts]
                    properties:
                      score: { type: integer, minimum: 0, maximum: 100, example: 68 }
                      level:
                        type: string
                        enum: [excellent, good, attention, risk]
                      parts:
                        type: array
                        items:
                          type: object
                          required: [key, points, value]
                          properties:
                            key:
                              type: string
                              enum: [savings, budgets, stability, small_expenses]
                            points: { type: number, minimum: 0, maximum: 25, example: 21.9 }
                            value:
                              type: number
                              nullable: true
                              description: |
                                El dato de la parte: % de ahorro, presupuestos cumplidos, % de
                                variación del gasto o % de gastos hormiga; `null` si no hay datos.
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Sync
  /ideas:
    get:
      tags: [Ideas]
      summary: Ideas públicas de Lo que viene
      description: |
        `upcoming` trae las planeadas y en progreso; `done`, las ya disponibles. Van de la más
        votada a la menos. No incluye quién envió cada idea.
      responses:
        '200':
          description: Ideas públicas
          content:
            application/json:
              schema:
                type: object
                required: [upcoming, done]
                properties:
                  upcoming:
                    type: array
                    items:
                      $ref: '#/components/schemas/Idea'
                  done:
                    type: array
                    items:
                      $ref: '#/components/schemas/Idea'
    post:
      tags: [Ideas]
      summary: Enviar una idea
      description: Queda en revisión y no se muestra hasta que el equipo la publique. Máximo 5 cada 24 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 120
      responses:
        '201':
          description: Idea recibida
          content:
            application/json:
              schema:
                type: object
                required: [id, title, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  status:
                    type: string
                    enum: [revision]
        '422':
          description: Título inválido
        '429':
          description: Ya envió el máximo de ideas del día
  /ideas/admin:
    get:
      tags: [Ideas]
      summary: Todas las ideas, para el equipo
      description: Solo para los correos de `ADMIN_EMAILS`. No incluye quién envió cada idea.
      responses:
        '200':
          description: Todas las ideas, de la más nueva a la más vieja
          content:
            application/json:
              schema:
                type: object
                required: [ideas]
                properties:
                  ideas:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminIdea'
        '403':
          description: No es administrador
    post:
      tags: [Ideas]
      summary: Agregar una idea del equipo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 120
                status:
                  $ref: '#/components/schemas/IdeaStatus'
      responses:
        '201':
          description: Idea creada
        '403':
          description: No es administrador
        '422':
          description: Datos inválidos
  /ideas/admin/{id}:
    patch:
      tags: [Ideas]
      summary: Cambiar el título o el estado de una idea
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 120
                status:
                  $ref: '#/components/schemas/IdeaStatus'
      responses:
        '200':
          description: Idea actualizada
        '403':
          description: No es administrador
        '404':
          description: La idea no existe
        '422':
          description: Datos inválidos
  /ideas/{id}/vote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Ideas]
      summary: Votar por una idea
      description: Votar dos veces deja un solo voto.
      responses:
        '204':
          description: Voto registrado
        '404':
          description: La idea no existe o ya no se puede votar
    delete:
      tags: [Ideas]
      summary: Quitar el voto
      responses:
        '204':
          description: Voto quitado
        '404':
          description: El id no es válido
  /whatsapp/webhook:
    get:
      tags: [WhatsApp]
      summary: Verificación del webhook por parte de Meta
      security: []
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Devuelve `hub.challenge` en texto plano
        '403':
          description: Token de verificación incorrecto
    post:
      tags: [WhatsApp]
      summary: Avisos de Meta
      description: Lo protege la firma `X-Hub-Signature-256`. Responde antes de procesar.
      security: []
      responses:
        '200':
          description: Aviso recibido
        '400':
          description: El cuerpo no es JSON válido
        '401':
          description: Firma ausente o incorrecta
  /whatsapp/link:
    get:
      tags: [WhatsApp]
      summary: Estado de la conexión del número
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                type: object
                required: [available, linked, phone, botNumber]
                properties:
                  available:
                    type: boolean
                    description: Si el bot está configurado y el usuario está en la lista autorizada
                  linked:
                    type: boolean
                  phone:
                    type: string
                    nullable: true
                    description: Solo los últimos cuatro dígitos
                  botNumber:
                    type: string
                    nullable: true
    post:
      tags: [WhatsApp]
      summary: Generar el código para vincular el número
      description: El código dura 10 minutos, sirve una vez y se le envía al bot.
      responses:
        '201':
          description: Código generado
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt, botNumber]
                properties:
                  code:
                    type: string
                    example: FT-AB23CD45
                  expiresAt:
                    type: string
                    format: date-time
                  botNumber:
                    type: string
                    nullable: true
        '403':
          description: El usuario no está en la lista autorizada
    delete:
      tags: [WhatsApp]
      summary: Desconectar el número
      responses:
        '204':
          description: Número desconectado
  /sync/batch:
    post:
      tags: [Sync]
      summary: Sincroniza un lote de operaciones hechas offline (máx. 200)
      description: |
        - Primero se valida todo el lote: si alguna operación es inválida responde 422
          (`details[].field` indica la operación, p. ej. `operations[3].serverId`) y no aplica nada.
        - Las operaciones se aplican en orden. `create` no duplica: si ese `localId` ya
          existe para el usuario, se devuelve el mismo `serverId` en `synced`.
        - Hay conflicto en `update`/`delete` cuando la transacción cambió en el servidor
          después de `lastSyncedAt`. Gana el `updatedAt` más reciente (last-write-wins, RN-07):
          `client_wins` aplica el cambio; `server_wins` lo descarta. Ambos casos van en
          `conflicts` con la `serverVersion` final. Sin conflicto, va en `synced`.
        - Una transacción creada offline sin categoría se categoriza con IA al sincronizar,
          solo para las primeras `SYNC_AI_MAX` del lote (por defecto 20); las demás y las que
          la IA no logra clasificar quedan con `source: sin_clasificar`.
        - `serverChanges` devuelve las transacciones del usuario (incluidas las borradas
          lógicamente) modificadas después de `lastSyncedAt`, sin las de este lote (REQ-025).
          Con `lastSyncedAt: null` (primera vez) devuelve todas las no borradas.
        - `syncStatus` vive solo en IndexedDB; el servidor no lo almacena.
        - Un lote con operaciones cuenta para el límite de peticiones de la IA (puede responder 429).
          Un lote vacío (`operations: []`) solo trae `serverChanges`, no usa la IA y no cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: Resultado de la sincronización
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---------------------------------------------------------------- Push
  /notifications:
    get:
      tags: [Notifications]
      summary: Avisos recientes y cuántos no ha leído
      description: >
        Bandeja de la app (FT-0045). Guarda todo lo que se envía por push (vacas, negocios, pago de
        tarjetas y presupuestos), aunque el usuario no tenga push activo; el recordatorio diario de
        registrar gastos no se guarda. Devuelve los 30 más recientes (se conservan hasta 100).
        Un presupuesto avisa una sola vez al llegar al 80 % y otra al pasarse.
      responses:
        "200":
          description: Avisos, del más reciente al más viejo
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  unread: { type: integer, minimum: 0 }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, body, url, read, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string, maxLength: 120 }
                        body: { type: string, maxLength: 300 }
                        url: { type: string, nullable: true, description: "Ruta de la app, p. ej. /app/vacas/{id}" }
                        read: { type: boolean }
                        createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Marca todos los avisos como leídos
      responses:
        "204": { description: Listo }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push/vapid-public-key:
    get:
      tags: [Push]
      summary: Llave pública VAPID para PushManager.subscribe()
      responses:
        "200":
          description: Llave pública
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push/subscribe:
    post:
      tags: [Push]
      summary: Registra la suscripción push del navegador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription: { $ref: "#/components/schemas/PushSubscription" }
      responses:
        "201": { description: Suscripción registrada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Push]
      summary: Elimina la suscripción (el usuario desactivó las notificaciones, REQ-029)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "204": { description: Suscripción eliminada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Reports
  /reports/export:
    get:
      tags: [Reports]
      summary: Exporta el reporte del periodo en Excel, los movimientos en CSV o el reporte en PDF
      description: >
        XLSX: libro de Excel con la hoja Resumen (ingresos, gastos, balance, tasa de ahorro, gasto
        promedio diario, gastos e ingresos por categoría, top 5 de gastos y, si el periodo es un mes
        completo, los presupuestos de ese mes), la hoja Movimientos (con filtros y totales que respetan
        el filtro) y la hoja Por mes si el periodo abarca varios meses. Las cifras del resumen son
        fórmulas sobre la hoja Movimientos.
        CSV: una fila por movimiento no eliminado entre `from` y `to` (incluidos), del más antiguo al
        más reciente, con las columnas Fecha;Tipo;Categoría;Descripción;Monto;Origen. Separador `;`,
        UTF-8 con BOM y monto con coma decimal, para que Excel en español lo abra bien. Los textos que
        empiezan por = + - @ llevan un apóstrofo delante (evita fórmulas). El nombre del archivo es
        `fintrack_AAAA-MM.<ext>` si el rango es un mes completo y `fintrack_<from>_<to>.<ext>` si no.
        PDF: tamaño Carta. Página 1 con indicadores, gastos por categoría, gasto por día (o ingresos y
        gastos por mes si abarca varios meses), top 5 de gastos y presupuestos del mes; desde la página 2,
        la tabla de movimientos con totales. Usa las mismas cifras que el XLSX.
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [xlsx, csv, pdf] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Archivo generado
          headers:
            Content-Disposition:
              description: 'attachment; filename="fintrack_2026-09.csv"'
              schema: { type: string }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: "NO_DATA — no hay transacciones en el periodo (REQ-033), o parámetros inválidos"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- Voice
  /voice/transcribe:
    post:
      tags: [Voice]
      summary: Convierte en texto el audio de una frase (registro por voz)
      description: |
        El cuerpo es el audio crudo de la frase (no JSON), de hasta 2 MB, y `Content-Type` dice su formato
        (Chrome graba `audio/webm`, Safari `audio/mp4`). El servidor lo envía a Whisper en Groq en español,
        con una pista de vocabulario de montos en pesos colombianos, y no lo guarda. Solo viaja el audio:
        ningún dato del usuario. El cliente interpreta el texto (monto, tipo, fecha) en el dispositivo.
        Sin `GROQ_API_KEY` responde 503 y el cliente usa el dictado del navegador.
      requestBody:
        required: true
        content:
          audio/webm: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
          audio/ogg: { schema: { type: string, format: binary } }
          audio/mpeg: { schema: { type: string, format: binary } }
          audio/wav: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Texto dicho; vacío si solo hubo silencio
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
              example:
                text: Ayer gasté 15 mil pesos en el almuerzo.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: "PAYLOAD_TOO_LARGE — el audio supera los 2 MB"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: "UNSUPPORTED_MEDIA_TYPE — el formato no es de audio aceptado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "TRANSCRIPTION_UNAVAILABLE — sin `GROQ_API_KEY` o Groq no respondió"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------- Assistant
  /assistant/chat:
    post:
      tags: [Assistant]
      summary: Responde una pregunta de finanzas con los datos del mes del usuario
      description: |
        El cliente envía los últimos mensajes de la conversación (máximo 10, de hasta 500 caracteres,
        del más antiguo al más reciente, terminando en una pregunta del usuario). El servidor le pasa a
        la IA (Gemini, modelo `ASSISTANT_MODEL`) solo datos agregados (RN-05, RNF-09): ingresos y gastos
        por categoría del mes actual hasta hoy, totales del mes anterior y los presupuestos del mes. Nunca
        descripciones de movimientos ni datos personales. La conversación no se guarda.
        Funciona desde el primer día: no exige la semana de historial de `GET /insights` (REQ-021).

        El modelo tiene herramientas (function calling) que el servidor ejecuta cuando las pide, para
        responder con datos reales en vez de inventarlos (máximo 4 vueltas por pregunta):
        `resumen_de_movimientos` (totales por categoría entre dos fechas), `ahorro_promedio` (sobrante
        mensual de los últimos 3 meses), `dolar_hoy` (TRM oficial), `tasas_cdt` (tasas de CDT por plazo
        que reportan las entidades a la Superintendencia Financiera) y `simular_cdt` (interés compuesto
        con retención en la fuente del 4 %). La TRM y las tasas se leen de datos.gov.co y se guardan
        en caché una hora.
        Límite de `ASSISTANT_DAILY_MAX` preguntas por usuario y día (por defecto 20), además del límite
        por minuto de los endpoints de IA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string, minLength: 1, maxLength: 500 }
            example:
              messages:
                - { role: user, text: ¿En qué gasto más? }
      responses:
        "200":
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                type: object
                required: [reply, toolsUsed]
                properties:
                  reply: { type: string, maxLength: 1500 }
                  toolsUsed:
                    type: array
                    description: Herramientas que consultó el asistente, sin repetir y en orden de uso
                    items: { type: string }
              example:
                reply: Para un CDT a 360 días el promedio es 12,77 % E.A.; la que más paga es Banco Pichincha con 13,31 % (corte del 27/10/2026, Superintendencia Financiera).
                toolsUsed: [tasas_cdt]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "AI_UNAVAILABLE — sin `AI_API_KEY` o la IA no respondió"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de 15 minutos.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: "VALIDATION_ERROR — body malformado a nivel de tipos (JSON inválido, tipo incorrecto)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: "VALIDATION_ERROR — incumple una regla de negocio; `details` indica qué campo marcar"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: VALIDATION_ERROR
              message: Datos inválidos
              details:
                - { field: amount, problem: Debe ser un número mayor que 0 }
    Unauthorized:
      description: "UNAUTHORIZED (sin token o inválido) o TOKEN_EXPIRED (llamar a /auth/refresh)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            unauthorized:
              value: { error: { code: UNAUTHORIZED, message: Token inválido o ausente } }
            expired:
              value: { error: { code: TOKEN_EXPIRED, message: El token expiró } }
    NotFound:
      description: "NOT_FOUND — no existe o pertenece a otro usuario (RN-01, nunca 403)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "RATE_LIMITED — demasiadas peticiones (login, registro, recuperar contraseña y endpoints con IA)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Attachment:
      type: object
      description: Soporte de pago de un movimiento (FT-0044). Nunca incluye dónde está guardado.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Nombre original, solo para mostrarlo" }
        type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size: { type: integer, description: Bytes }
        createdAt: { type: string, format: date-time }
    IdeaStatus:
      type: string
      enum: [revision, planeada, en_progreso, lista, descartada]
    AdminIdea:
      type: object
      required: [id, title, status, votes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/IdeaStatus'
        votes:
          type: integer
        createdAt:
          type: string
          format: date-time
    Idea:
      type: object
      required: [id, title, status, votes, voted]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [planeada, en_progreso, lista]
        votes:
          type: integer
        voted:
          type: boolean
          description: Si el usuario ya votó por ella.
    # ---------- Errores
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - TOKEN_EXPIRED
                - NOT_FOUND
                - EMAIL_TAKEN
                - INVALID_RESET_TOKEN
                - BUDGET_EXISTS
                - INSUFFICIENT_HISTORY
                - NO_DATA
                - RATE_LIMITED
                - INTERNAL_ERROR
                - AI_UNAVAILABLE
                - TRANSCRIPTION_UNAVAILABLE
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
            message: { type: string }
            details:
              type: array
              description: Solo en errores de validación (422).
              items:
                type: object
                required: [field, problem]
                properties:
                  field: { type: string, example: amount }
                  problem: { type: string, example: Debe ser un número mayor que 0 }

    # ---------- Tipos base
    CardInput:
      type: object
      description: En `POST` son obligatorios network, tier, last4, limit, available y paymentDay; en `PUT` todos son opcionales y `available` no se acepta.
      properties:
        network: { type: string, enum: [visa, mastercard, amex, otra] }
        tier: { type: string, enum: [clasica, gold, platinum, black, green, blue] }
        last4: { type: string, pattern: '^\d{4}$' }
        limit: { type: number, exclusiveMinimum: true, minimum: 0 }
        available: { type: number, minimum: 0, description: "Solo al crear; 0 ≤ available ≤ limit." }
        paymentDay: { type: integer, minimum: 1, maximum: 31 }
        cutoffDay: { type: integer, minimum: 1, maximum: 31, nullable: true }
        name: { type: string, maxLength: 40, description: "Si no se da (o se editan dígitos o nivel de una tarjeta con el nombre por defecto), se usa \"Amex Blue ••1234\"." }
    Card:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        network: { type: string, enum: [visa, mastercard, amex, otra] }
        tier: { type: string }
        last4: { type: string }
        limit: { type: number }
        used: { type: number }
        available: { type: number }
        paymentDay: { type: integer }
        cutoffDay: { type: integer, nullable: true }
        statementTotal: { type: number, nullable: true, description: "null cuando el extracto ya venció (su fecha límite es anterior a nextPaymentDate) o lo pagado desde que se dio lo cubre." }
        statementDueDate: { type: string, format: date, nullable: true, description: "null en los mismos casos que statementTotal." }
        nextPaymentDate: { type: string, format: date, description: "Primer vencimiento sin \"Ya pagué\"; si ya pasó, el pago está atrasado." }
        daysToPayment: { type: integer, description: "Negativo si el pago está atrasado." }
        paidThisCycle: { type: boolean, description: "El vencimiento de este mes (y los anteriores) ya tienen pago; cuenta todos los pagos, también los anteriores a una actualización con el banco." }
        paidDueDate: { type: string, format: date, nullable: true, description: "Vencimiento del último ciclo pagado (el calendario lo muestra pagado en esa fecha)." }
        paidAmount: { type: number, description: "Suma de los pagos de ese ciclo; 0 si no hay." }
        reminderSentFor: { type: string, format: date, nullable: true, description: Fecha de pago ya avisada por push }
    Amount:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      description: Monto en COP; siempre número JSON, nunca texto.
      example: 25000
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: "2026-09"
    TransactionType:
      type: string
      enum: [ingreso, gasto]
    ExpenseCategoryKey:
      type: string
      enum:
        - alimentacion
        - transporte
        - vivienda
        - servicios_publicos
        - salud
        - educacion
        - entretenimiento
        - ropa_accesorios
        - tecnologia
        - ahorro_inversion
        - otros
    IncomeCategoryKey:
      type: string
      enum: [salario, freelance, inversion_rendimientos, otros_ingresos]
    CategoryKey:
      oneOf:
        - { $ref: "#/components/schemas/ExpenseCategoryKey" }
        - { $ref: "#/components/schemas/IncomeCategoryKey" }
    NullableCategoryKey:
      type: string
      nullable: true
      description: Clave del catálogo (gasto o ingreso); null si no está clasificada.
      enum:
        - alimentacion
        - transporte
        - vivienda
        - servicios_publicos
        - salud
        - educacion
        - entretenimiento
        - ropa_accesorios
        - tecnologia
        - ahorro_inversion
        - otros
        - salario
        - freelance
        - inversion_rendimientos
        - otros_ingresos
        - null

    # ---------- Auth y usuario
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string, nullable: true, maxLength: 60, example: Felipe }
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      required: [id, email, name, timezone, isAdmin]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name:
          type: string
          nullable: true
          maxLength: 60
          description: Nombre visible. `null` si el usuario no lo ha puesto.
          example: Felipe
        timezone: { type: string, example: America/Bogota }
        isAdmin:
          type: boolean
          description: Si administra Lo que viene (`ADMIN_EMAILS`).
    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, nullable: true, maxLength: 60, example: Felipe }
    ReminderSettings:
      type: object
      required: [times, timezone]
      properties:
        times:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: ["08:00", "20:00"]
          description: |
            Horas del recordatorio (HH:mm) en la zona horaria del usuario, hasta 5 al día. En el PUT se
            ordenan y se quitan las repetidas; un arreglo vacío desactiva el recordatorio.
        time:
          type: string
          nullable: true
          deprecated: true
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "08:00"
          description: |
            Compatibilidad con clientes anteriores. En la respuesta es la primera hora de `times` (o null).
            En el PUT se acepta en lugar de `times` (una sola hora; null desactiva).
        timezone: { type: string, example: America/Bogota }
        cardReminders:
          type: boolean
          description: |
            Si recibe el aviso push 3 días antes del pago de una tarjeta (a la primera hora de `times`, o 09:00).
            Opcional en el PUT: si se omite, no cambia.

    # ---------- Transacciones
    Category:
      type: object
      required: [key, name, icon, color, custom]
      properties:
        key: { type: string, example: alimentacion }
        name: { type: string, example: Alimentación }
        icon:
          description: Ícono elegido; `null` en las 15 de todos (el frontend tiene el suyo)
          oneOf: [{ $ref: "#/components/schemas/CategoryIcon" }, { type: "null" }]
        color:
          description: Color elegido; `null` en las 15 de todos
          oneOf: [{ $ref: "#/components/schemas/CategoryColor" }, { type: "null" }]
        custom: { type: boolean, description: "`true` si la creó el usuario" }
    CategoryIcon:
      type: string
      enum: [paw-print, dumbbell, gift, plane, baby, car, fuel, coffee, pizza, beer, gamepad, music, book, shopping-cart, heart, smartphone, scissors, briefcase, piggy-bank, sparkles]
    CategoryColor:
      type: string
      enum: [orange, sky, amber, rose, teal, fuchsia, indigo, emerald]
    Transaction:
      type: object
      required: [id, userId, amount, description, type, category, source, date, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Amount" }
        description: { type: string }
        type: { $ref: "#/components/schemas/TransactionType" }
        category: { $ref: "#/components/schemas/NullableCategoryKey" }
        source:
          type: string
          enum: [manual, ia, sin_clasificar]
          description: Cómo se asignó la categoría; sin_clasificar cuando la IA falló.
        date: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Usado para last-write-wins (RN-07) }
        deletedAt: { type: string, format: date-time, nullable: true }
        card:
          type: object
          nullable: true
          required: [id, name, last4, deleted]
          description: "Tarjeta con la que se pagó el gasto; `null` si no usó tarjeta. Si la tarjeta se borró, sigue aquí con `deleted: true`."
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            last4: { type: string }
            deleted: { type: boolean }
        installments:
          type: integer
          nullable: true
          minimum: 1
          maximum: 48
          description: Cuotas del gasto con tarjeta; `null` si no usó tarjeta.
    TransactionInput:
      type: object
      required: [amount, description, type, date]
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        description: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/TransactionType" }
        category:
          allOf: [{ $ref: "#/components/schemas/NullableCategoryKey" }]
          description: Opcional; si viene vacío se categoriza con IA.
        date: { type: string, format: date }
        card:
          type: string
          format: uuid
          nullable: true
          description: Tarjeta propia (no borrada) con la que se pagó. Solo un gasto puede llevarla; si no, 422 en el campo `card`.
        installments:
          type: integer
          minimum: 1
          maximum: 48
          description: Cuotas (1 por defecto con tarjeta). Se ignora si no hay `card`.
        localId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Opcional. Id que genera el cliente antes de enviar. Si llega de nuevo (la respuesta
            anterior se perdió), se devuelve la transacción ya guardada en lugar de crear otra.
    TransactionUpdate:
      type: object
      minProperties: 1
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        description: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/TransactionType" }
        category: { $ref: "#/components/schemas/NullableCategoryKey" }
        date: { type: string, format: date }
        card:
          type: string
          format: uuid
          nullable: true
          description: Tarjeta propia (no borrada); `null` la quita. Al cambiar `type` a ingreso se quita sola. Solo un gasto puede llevarla; si no, 422 en el campo `card`.
        installments:
          type: integer
          minimum: 1
          maximum: 48
          description: Cuotas (1 por defecto con tarjeta). Se ignora si no hay `card`.
    TransactionWithAlert:
      type: object
      required: [transaction, alert]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        alert:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Alert" }]
          description: null si la categoría no tiene presupuesto o no hay alerta activa.
    CategoryTotal:
      type: object
      required: [category, total, percentage]
      properties:
        category: { $ref: "#/components/schemas/NullableCategoryKey" }
        total: { type: number }
        percentage: { type: number }
    Summary:
      type: object
      required: [period, from, to, income, expense, savings, timeSeries]
      properties:
        period: { type: string, enum: [week, month, year] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        income:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items: { $ref: "#/components/schemas/CategoryTotal" }
        expense:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: number }
            byCategory:
              type: array
              items: { $ref: "#/components/schemas/CategoryTotal" }
        savings:
          type: object
          description: Lo registrado como gasto en Ahorro/Inversión. No cuenta en `expense` ni en `timeSeries`, pero sí se resta del balance disponible (ingresos − gastos − ahorro).
          required: [total]
          properties:
            total: { type: number, example: 200000 }
        timeSeries:
          type: array
          description: Un punto por día (week, month) o por mes (year, con el día 1 como fecha); solo días o meses con movimientos. `expense` no incluye el ahorro.
          items:
            type: object
            required: [date, income, expense]
            properties:
              date: { type: string, format: date }
              income: { type: number }
              expense: { type: number }

    # ---------- Presupuestos
    Alert:
      type: object
      required: [level, percentage]
      properties:
        level: { type: string, enum: [none, warning_80, exceeded_100] }
        percentage: { type: number, example: 85.5 }
    BudgetCreated:
      type: object
      required: [id, category, month, amount]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/ExpenseCategoryKey" }
        month: { $ref: "#/components/schemas/Month" }
        amount: { $ref: "#/components/schemas/Amount" }
    MoneyProfileInput:
      type: object
      properties:
        incomeType: { type: string, nullable: true, enum: [fecha_fija, sin_fecha] }
        payDays:
          description: Días de pago; obligatorios con `fecha_fija` y se ignoran sin ella.
          type: array
          maxItems: 4
          items: { type: integer, minimum: 1, maximum: 31 }
        balance: { type: number, nullable: true, minimum: 0 }
        resetBalance:
          type: boolean
          description: "Solo en `PUT`: el usuario corrigió el saldo; lo registrado antes de ahora deja de sumarse."
    MoneyProfile:
      type: object
      required: [incomeType, payDays, balance, balanceAt, money, totals, welcomeDone, commitments]
      properties:
        incomeType: { type: string, nullable: true, enum: [fecha_fija, sin_fecha] }
        payDays:
          type: array
          items: { type: integer, minimum: 1, maximum: 31 }
        balance: { type: number, nullable: true }
        balanceAt: { type: string, format: date-time, nullable: true }
        money: { type: number, nullable: true, description: "Plata actual: `balance` más lo registrado después" }
        totals:
          description: Todo lo que el usuario ha registrado
          type: object
          properties:
            income: { type: number }
            expense: { type: number }
        welcomeDone: { type: boolean }
        commitments:
          type: array
          items: { $ref: "#/components/schemas/Commitment" }
    MoneyPlan:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }
        mode: { type: string, enum: [daily, goal, runway] }
        money: { type: number, description: Plata actual }
        ledger: { type: number, description: "Todos los ingresos menos todos los gastos registrados" }
        pendingTotal: { type: number }
        free: { type: number }
        shortfall: { type: number, description: Lo que falta para los compromisos; 0 si alcanza }
        pace: { type: number, nullable: true, description: Gasto normal por día }
        hasCommitments: { type: boolean }
        pending:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              amount: { type: number }
              date: { type: string, format: date }
        nextPay: { type: string, format: date, description: Solo `daily` }
        days: { type: integer, description: "Días del cálculo; `daily` y `goal`" }
        perDay: { type: number, description: "Solo `daily`: límite de hoy, fijo todo el día" }
        spentToday: { type: number, description: "Solo `daily`: gastos de hoy, sin pagos de compromisos" }
        leftToday: { type: number, description: Solo `daily` }
        overBy: { type: number, description: "Solo `daily`: cuánto se pasó del límite" }
        dayStatus: { type: string, enum: [ok, near, over], description: "Solo `daily`: `near` desde el 80 %" }
        saveAdvice: { type: number, description: Cuánto se sugiere apartar; 0 si no le sobra plata }
        goal: { type: number, description: Solo `goal` }
        until: { type: string, description: "Solo `goal`: el último compromiso pendiente" }
        todayIncome: { type: number, description: Solo `goal` }
        usualIncome: { type: number, nullable: true, description: Solo `goal` }
        runwayDays: { type: integer, nullable: true, description: Solo `runway` }
    CommitmentInput:
      type: object
      required: [name, amount, dayOfMonth]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        amount: { $ref: "#/components/schemas/Amount" }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
    Commitment:
      allOf:
        - { $ref: "#/components/schemas/CommitmentInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Budget:
      allOf:
        - { $ref: "#/components/schemas/BudgetCreated" }
        - type: object
          required: [consumed, percentage, alert]
          properties:
            consumed: { type: number }
            percentage: { type: number }
            alert: { $ref: "#/components/schemas/Alert" }

    # ---------- Insights
    Insight:
      type: object
      required: [type, title, detail]
      properties:
        type:
          type: string
          enum: [saving_opportunity, overspending_alert, positive_trend, general_tip]
          example: saving_opportunity
        title: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 300 }

    # ---------- Sync
    SyncOperation:
      type: object
      required: [op, localId]
      properties:
        op: { type: string, enum: [create, update, delete] }
        localId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Id generado en IndexedDB. En `create` el servidor lo guarda: si el mismo lote
            se reenvía (respuesta perdida), devuelve el mismo `serverId` sin duplicar.
        serverId:
          type: string
          format: uuid
          description: Id de la transacción en el servidor. Obligatorio en `update` y `delete`.
        updatedAt:
          type: string
          format: date-time
          description: |
            Hora en que se hizo el cambio en el dispositivo. Obligatoria en `update` y
            `delete`; se compara con el `updatedAt` del servidor (last-write-wins, RN-07).
        transaction:
          type: object
          description: |
            En `create`, la transacción completa (`TransactionInput`). En `update`, solo los
            campos que cambian (`TransactionUpdate`). Se omite en `delete`.
    SyncRequest:
      type: object
      required: [lastSyncedAt, operations]
      properties:
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: Última sincronización exitosa de este dispositivo; null la primera vez.
        operations:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/SyncOperation" }
    SyncResponse:
      type: object
      required: [synced, conflicts, serverChanges, syncedAt, notices]
      properties:
        synced:
          type: array
          items:
            type: object
            required: [localId, serverId]
            properties:
              localId: { type: string }
              serverId: { type: string, format: uuid }
              transaction:
                allOf: [{ $ref: "#/components/schemas/Transaction" }]
                description: |
                  En `create` y `update`: la transacción guardada. No vuelve en `serverChanges`
                  y el cliente necesita la categoría que le quedó (la IA pudo asignarla). Se omite en `delete`.
        conflicts:
          type: array
          items:
            type: object
            required: [localId, serverId, resolution, serverVersion]
            properties:
              localId: { type: string }
              serverId: { type: string, format: uuid }
              resolution: { type: string, enum: [server_wins, client_wins] }
              serverVersion:
                type: object
                nullable: true
                allOf: [{ $ref: "#/components/schemas/Transaction" }]
                description: |
                  Versión que queda en el servidor (la del cliente si ganó). `null` si el
                  `serverId` no existe o es de otro usuario: el cliente debe descartar el cambio.
        serverChanges:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        notices:
          type: array
          description: |
            Avisos de cosas que el servidor ajustó para no perder lo digitado offline. `cardDropped`:
            la tarjeta ya no es válida (borrada, ajena, inexistente o el movimiento no es un gasto);
            el gasto se guardó sin tarjeta.
          items:
            type: object
            required: [localId, code]
            properties:
              localId: { type: string }
              code: { type: string, enum: [cardDropped] }
        syncedAt:
          type: string
          format: date-time
          description: Guardar en el cliente y enviarlo como lastSyncedAt en la próxima sincronización.

    # ---------- Push
    PushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
